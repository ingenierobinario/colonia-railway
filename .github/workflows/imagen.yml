# Construye la imagen del servidor de Colonia y la publica en ghcr.io para la plantilla de Railway.
name: imagen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(grep -m1 -oE '[0-9]+\.[0-9]+\.[0-9]+' scripts/docker/railway/estable.txt)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/docker/Dockerfile
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/ingenierobinario/colonia-railway:latest
            ghcr.io/ingenierobinario/colonia-railway:${{ steps.v.outputs.version }}
